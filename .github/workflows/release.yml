name: release

# Tag a version to publish: `git tag v0.1.0 && git push origin v0.1.0`.
# The release is created as a draft so you can write the notes before it goes out.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sidecar: windows
            bundles: nsis
          - os: ubuntu-22.04
            sidecar: linux
            bundles: deb,appimage
          # Apple Silicon. An Intel build would double the download for
          # hardware Apple stopped selling, so it is not built for now.
          - os: macos-14
            sidecar: macos
            bundles: dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            cmake \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ~80 MB per platform; only re-downloaded when the fetch script changes.
      - name: Cache ffmpeg sidecars
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.sidecar }}-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Fetch ffmpeg sidecars
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh ${{ matrix.sidecar }}

      # The AppImage bundler downloads AppRun and linuxdeploy at build time,
      # straight from GitHub releases. That download dropped mid-flight once
      # and took the whole release with it; caching it keeps a flaky CDN from
      # being a release blocker.
      - name: Cache Tauri bundler tooling
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-${{ matrix.sidecar }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers and the latest.json manifest the app reads to
          # find updates. Without this secret the build fails by design: an
          # unsigned update is one the app will refuse anyway.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Coldmill __VERSION__"
          releaseBody: |
            Offline batch converter for audio, video, images, documents and 3D models.

            **Windows** — the `.exe` installer.
            **Linux** — the `.AppImage` (portable) or the `.deb`.
            **macOS** — the `.dmg` (Apple Silicon).

            The macOS build is not signed by Apple yet, so Gatekeeper will
            refuse it on first launch. Open System Settings → Privacy &
            Security and press "Open Anyway", or run
            `xattr -dr com.apple.quarantine /Applications/Coldmill.app`.

            ffmpeg ships inside the installer. The document and 3D engines are
            optional and downloaded from the app's setup screen if you want them.

            See [CHANGELOG.md](https://github.com/batushn/coldmill/blob/main/CHANGELOG.md) for what is in this build.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
