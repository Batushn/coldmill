[package]
name = "coldmill"
version = "0.4.0"
description = "Offline batch file converter for audio, video, images, documents and 3D models"
authors = ["Coldmill contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/batushn/coldmill"
edition = "2021"
rust-version = "1.88"

[lib]
name = "coldmill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# In-app updates. The process plugin is what restarts into the new build.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
# Key order is kept, so a JSON file turned into YAML reads in the order it
# was written instead of alphabetically.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "fs",
  "io-util",
] }

infer = "0.16"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }

# Engine downloads (document / 3D modules)
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
  "charset",
  "http2",
] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Built-in mesh conversion, so the 3D module works without Blender.
# STL is hand-rolled: the format is a 84-byte header plus 50 bytes per
# triangle, which is less code than adapting to a crate's mesh types.
tobj = "4"

# Built-in OCR. A library rather than a program, so it works on both platforms
# without a binary that has to exist for each of them; only its models are
# downloaded.
ocrs = "0.12"
# Pinned to the version ocrs itself depends on: two copies of rten in the
# tree means two incompatible Model types, and the compiler says so.
rten = "0.24"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "tiff",
  "bmp",
  "gif",
] }
gltf = { version = "1", default-features = false, features = ["import", "utils"] }

# Spreadsheets and structured data, converted in-process so neither needs
# LibreOffice: calamine reads xlsx/xls/xlsb/ods, rust_xlsxwriter writes xlsx,
# and the rest are the plain-text formats people move data around in.
calamine = "0.37"
rust_xlsxwriter = { version = "0.101.0", default-features = false }
csv = "1.4.0"
toml = { version = "1.1.8", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"

# Text out of a PDF without LibreOffice, which only ever opened one as a
# drawing and exported nothing at all.
pdf-extract = "0.12.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
