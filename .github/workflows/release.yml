name: release

# Tag a version to publish: `git tag v0.1.0 && git push origin v0.1.0`.
# The release is created as a draft so you can write the notes before it goes out.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # The three builds take thirteen minutes and the very last thing they do is
  # create the release. When the token cannot, that arrives as a build failure
  # after thirteen minutes of work that was never wrong. This asks first.
  preflight:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the token is allowed to publish
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # An empty body is never a valid release, so an allowed token is
          # refused with 422 for the missing tag and a blocked one with 403
          # for the missing permission. Nothing is created either way.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
            -d '{}')
          echo "the releases endpoint answered $code"
          if [ "$code" = "422" ]; then
            echo "The token can publish. Building."
            exit 0
          fi
          if [ "$code" = "403" ]; then
            echo "::error::The token cannot create releases, so the build would"
            echo "::error::fail at the end rather than the start. Either set"
            echo "::error::Workflow permissions to read and write at"
            echo "::error::https://github.com/settings/actions and in the"
            echo "::error::repository's own Actions settings, or add a"
            echo "::error::fine-grained token with Contents: read and write as"
            echo "::error::the RELEASE_TOKEN secret."
            exit 1
          fi
          echo "::error::Unexpected answer $code from the releases endpoint."
          exit 1

  build:
    needs: preflight
    # Deleting a tag is also a push, and GitHub runs this on it: removing
    # v0.1.0 started a build of v0.1.0, against a ref that no longer exists.
    # Nothing but a real tag should ever produce a release.
    if: github.event.deleted != true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sidecar: windows
            bundles: nsis
          - os: ubuntu-22.04
            sidecar: linux
            bundles: deb,appimage
          # Apple Silicon. An Intel build would double the download for
          # hardware Apple stopped selling, so it is not built for now.
          - os: macos-14
            sidecar: macos
            # `app` as well as `dmg`: the .dmg is what a person downloads,
            # but the updater reads a .app.tar.gz, and the bundler only
            # writes one when the app bundle is a requested target. Asking
            # for the dmg alone produced a macOS release nothing could
            # update from.
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            cmake \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ~80 MB per platform; only re-downloaded when the fetch script changes.
      - name: Cache ffmpeg sidecars
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.sidecar }}-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Fetch ffmpeg sidecars
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh ${{ matrix.sidecar }}

      # The AppImage bundler downloads AppRun and linuxdeploy at build time,
      # straight from GitHub releases. That download dropped mid-flight once
      # and took the whole release with it; caching it keeps a flaky CDN from
      # being a release blocker.
      - name: Cache Tauri bundler tooling
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-${{ matrix.sidecar }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # RELEASE_TOKEN when it exists, the built-in token otherwise.
          #
          # A job can ask for `contents: write`, but it cannot ask for more
          # than the repository's own Actions setting allows — the setting is
          # a ceiling, not a default. When that ceiling is read-only the build
          # runs all the way through and then fails on the last call, creating
          # the release, which reads as a build failure and is not one. A
          # personal access token carries its own permission and is not capped
          # by anything.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Signs the installers and the latest.json manifest the app reads to
          # find updates. Without this secret the build fails by design: an
          # unsigned update is one the app will refuse anyway.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Coldmill __VERSION__"
          releaseBody: |
            Offline batch converter for audio, video, images, documents and 3D models.

            **Windows** — the `.exe` installer.
            **Linux** — the `.AppImage` (portable) or the `.deb`.
            **macOS** — the `.dmg` (Apple Silicon).

            **macOS will say the app is "damaged and can't be opened". It is not.**
            That is the message Gatekeeper shows for any app it cannot verify,
            and this build is not signed by Apple yet. Drag Coldmill to
            Applications first, then run:

            ```
            xattr -dr com.apple.quarantine /Applications/Coldmill.app
            ```

            System Settings → "Open Anyway" does not help with this particular
            message; the command above is the way through.

            ffmpeg ships inside the installer. The document and 3D engines are
            optional and downloaded from the app's setup screen if you want them.

            See [CHANGELOG.md](https://github.com/batushn/coldmill/blob/main/CHANGELOG.md) for what is in this build.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
