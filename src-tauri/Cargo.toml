[package]
name = "coldmill"
version = "0.1.0"
description = "Offline batch file converter for audio, video and images"
authors = ["Coldmill contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/batuhansahin/coldmill"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coldmill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

infer = "0.16"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
