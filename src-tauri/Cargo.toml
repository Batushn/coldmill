[package]
name = "coldmill"
version = "0.1.0"
description = "Offline batch file converter for audio, video, images, documents and 3D models"
authors = ["Coldmill contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/batushn/coldmill"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coldmill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# In-app updates. The process plugin is what restarts into the new build.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "fs",
  "io-util",
] }

infer = "0.16"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }

# Engine downloads (document / 3D modules)
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
  "charset",
  "http2",
] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Built-in mesh conversion, so the 3D module works without Blender.
# STL is hand-rolled: the format is a 84-byte header plus 50 bytes per
# triangle, which is less code than adapting to a crate's mesh types.
tobj = "4"
gltf = { version = "1", default-features = false, features = ["import", "utils"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
